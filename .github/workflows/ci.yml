name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tendy
          POSTGRES_PASSWORD: tendy
          POSTGRES_DB: tendy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tendy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://tendy:tendy@localhost:5432/tendy
        run: pnpm exec drizzle-kit migrate

      - name: Build shared package
        run: pnpm --filter @tendy/shared build

      - name: Typecheck
        run: pnpm --filter @tendy/api typecheck

      - name: Build
        run: pnpm --filter @tendy/api build

      - name: Test
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://tendy:tendy@localhost:5432/tendy
          JWT_SECRET: ci-test-secret
        run: pnpm test
